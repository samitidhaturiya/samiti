<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#B0571A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#8A4214" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>समिति का हिसाब</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFDF7; --surface:#FFFFFF; --ink:#2A1A14; --muted:#75645A; --line:#E9DFCF;
  --bahi:#8E1B2C; --bahi-ink:#FFF4E6; --head:#B0571A; --head-ink:#FFF6EC; --head-line:#F2B66B; --haldi:#C98A12; --haldi-soft:#FBEFD2;
  --ok:#2F7A4A; --ok-soft:#E3F2E7; --due:#B3261E; --due-soft:#FBE4E2;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#181012; --surface:#22181A; --ink:#F3E9E0; --muted:#B3A49A; --line:#3A2C2E;
    --bahi:#5E1420; --bahi-ink:#FFE9D2; --head:#8A4214; --head-ink:#FFEBD6; --head-line:#C98A3A; --haldi:#F0B848; --haldi-soft:#3A2D14;
    --ok:#6FCB8E; --ok-soft:#173023; --due:#F2877F; --due-soft:#3A1A18;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
h1,h2,h3{font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",Georgia,serif;font-weight:400;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

header.top{background:var(--head);color:var(--head-ink);padding:18px 0 0}
header.top .wrap{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header.top h1{font-size:1.55rem;line-height:1.25}
header.top .role{font-size:.9rem;opacity:.85;margin-top:2px}
.loginbtn{background:transparent;border:1px solid rgba(255,244,230,.55);color:var(--head-ink);border-radius:999px;padding:4px 12px;font-size:.85rem;white-space:nowrap;cursor:pointer}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);border-bottom:3px solid var(--head-line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px}
nav.tabs a{color:var(--head-ink);text-decoration:none;padding:8px 14px 10px;white-space:nowrap;border-radius:10px 10px 0 0;opacity:.8;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink);opacity:1}
nav.tabs a .badge{display:inline-block;background:var(--haldi);color:#2A1A14;border-radius:999px;padding:0 7px;font-size:.78rem;margin-left:4px}

main{padding:20px 0 48px}
section{margin-bottom:28px}
h2{font-size:1.35rem;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line);gap:12px}
.ledger .row:first-child{border-top:0}
.ledger .row.total{background:var(--haldi-soft)}
.ledger .row.total .amt{font-size:1.9rem;font-family:"Tiro Devanagari Hindi",Georgia,serif}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.minus{color:var(--due)}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{padding:12px 2px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}
.item .main{min-width:0;flex:1}
.item .title{font-weight:500;overflow-wrap:anywhere}
.item .meta{font-size:.88rem;color:var(--muted)}
.item.left{opacity:.6}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.neutral{background:var(--haldi-soft);color:var(--ink)}

.toggle{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-width:96px;font-weight:500;cursor:pointer}
.toggle.paid{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.toggle.unpaid{background:var(--due-soft);border-color:transparent;color:var(--due)}
.toggle:disabled{cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.next-meet{border-left:5px solid var(--haldi)}
.notice{border-left:5px solid var(--bahi);margin-bottom:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.req{border-left:5px solid var(--haldi);margin-bottom:10px}

form.f{display:grid;gap:10px;background:var(--surface);border:1px dashed var(--haldi);border-radius:14px;padding:14px;margin-bottom:16px}
form.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:1rem}
input[type=checkbox]{width:auto}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--haldi);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--bahi);color:#FFF4E6;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--due);border:1px solid var(--due)}
.btn.okb{background:var(--ok);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink);background:var(--paper);cursor:pointer}
.checks label.on{border-color:var(--ok);background:var(--ok-soft)}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthbar h2{margin:0;text-align:center;flex:1}
.stat-line{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:20;display:none;max-width:90vw;text-align:center}
.status.show{display:block}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.modal img{max-width:100%;max-height:80vh;border-radius:8px;background:#fff}
.modal .bar{display:flex;gap:8px;margin-bottom:10px}
.modal .btn.danger{background:#fff}
.namebtn{background:none;border:0;padding:0;font:inherit;font-weight:500;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.namebtn:hover{text-decoration-color:var(--haldi)}
.namebtn .chev{color:var(--muted);text-decoration:none;display:inline-block}
.mlist .yearhead{padding:8px 16px;background:var(--paper);font-weight:700;border-top:1px solid var(--line);color:var(--muted)}
.mlist .yearhead:first-child{border-top:0}
.mrow{display:grid;grid-template-columns:1fr auto minmax(90px,auto);gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.mrow .amt{text-align:right}
.mrow.dim{opacity:.55}
@media (max-width:420px){form.f .two{grid-template-columns:1fr}}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--head-line,#F2B66B);background:#fff;flex:none}
@media (max-width:420px){header.top .logo{width:50px;height:50px}}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  body::before{display:none!important}
  :root{padding:0}
  body{background:#fff!important;color:#000!important;font-size:12px}
  #print-area{display:block;color:#000}
  #print-area .ptop{display:flex;gap:12px;align-items:center;border-bottom:3px solid #B0571A;padding-bottom:8px;margin-bottom:6px}
  #print-area .ptop img{width:64px;height:64px;border-radius:50%;object-fit:cover}
  #print-area h1{font-size:20px} #print-area h2{font-size:15px;margin:14px 0 6px}
  #print-area table{width:100%;border-collapse:collapse;margin-bottom:6px}
  #print-area th,#print-area td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  #print-area th{background:#f3e6d8}
  #print-area .r{text-align:right}
  @page{margin:12mm}
}
</style>
<script src="config.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img id="logo" class="logo" alt="" hidden><div><h1 id="samitiName">समिति का हिसाब</h1><div class="role" id="roleLine">लोड हो रहा है…</div></div></div>
  <button class="loginbtn" id="loginBtn" type="button" hidden>लॉगआउट</button>
</div></header>
<nav class="tabs" aria-label="भाग"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="app"><p class="muted">हिसाब खुल रहा है…</p></div></main>
<div class="status" id="status" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, addDoc, deleteDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, initializeAuth, inMemoryPersistence, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const MONTHS=["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
const LOGIN_DOMAIN="samiti-login.app";
const S={data:null,exists:false,admin:false,user:null,me:null,authReady:false,noAccess:false,loaded:false,error:"",month:curMonth(),monthNow:curMonth(),view:"saransh",
  requests:[],logins:{},editing:null,leaving:null,rejoining:null,decisionEdit:null,meetEdit:null,expEdit:null,detail:null,showGone:false,busy:{},billCache:{},deferred:false,saving:Promise.resolve(),
  req:{months:[],amount:"",method:"नकद",note:"",sent:false}};
let db,auth,secAuthInst=null,C=window.SAMITI_CONFIG,subs=[];

function curMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function monthLabel(m){const [y,mo]=m.split("-");return MONTHS[+mo-1]+" "+y}
function addMonth(m,n){let [y,mo]=m.split("-").map(Number);mo+=n;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+"-"+String(mo).padStart(2,"0")}
function monthsBetween(a,b){if(!a||a>b)return[];const out=[];let m=a;while(m<=b){out.push(m);m=addMonth(m,1)}return out}
function dateLabel(d){if(!d)return"";const [y,m,dd]=d.split("-");return (+dd)+" "+MONTHS[+m-1]+" "+y}
function rs(n){return "₹"+Math.round(n||0).toLocaleString("en-IN")}
function uid(){return Math.random().toString(36).slice(2,10)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false)continue;
    if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="class")el.className=v;
    else if(k==="text")el.textContent=v;
    else if(k==="value")el.value=v;
    else if(k==="checked")el.checked=!!v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}
  return el;
}
function toast(msg){const s=document.getElementById("status");s.textContent=msg;s.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>s.classList.remove("show"),2600)}
function confirmBtn(label,cls,onYes){
  const b=h("button",{class:"btn small "+cls,type:"button",text:label});
  let armed=false,t;
  b.addEventListener("click",()=>{
    if(!armed){armed=true;b.textContent="पक्का?";t=setTimeout(()=>{armed=false;b.textContent=label},3000);return}
    clearTimeout(t);onYes();
  });
  return b;
}

// ---------- data helpers ----------
function D(){return S.data||{}}
function amount(){return Number(D().monthly)||100}
function isSkipped(month){return (D().skipped||[]).includes(month)}
function periods(m){return (Array.isArray(m.periods)&&m.periods.length)?m.periods.map(p=>({from:p.from,to:p.to||null})):[{from:m.join,to:m.left||null}]}
function syncPeriods(x){x.periods.sort((a,b)=>a.from.localeCompare(b.from));x.join=x.periods[0].from;x.left=x.periods[x.periods.length-1].to||null}
function memberActiveIn(m,month){return periods(m).some(p=>p.from<=month&&(!p.to||p.to>=month))}
function isCurrent(m){const ps=periods(m),l=ps[ps.length-1];return l.from<=S.monthNow?(!l.to||l.to>=S.monthNow):true}
function paidFor(mid,month){return Number(((D().payments||{})[mid]||{})[month])||0}
function memberMonths(m){const out=[];for(const p of periods(m)){const end=p.to&&p.to<S.monthNow?p.to:S.monthNow;for(const mo of monthsBetween(p.from,end))if(!isSkipped(mo)&&!out.includes(mo))out.push(mo)}return out}
function memberSummary(m){
  const months=memberMonths(m);const expected=months.length*amount();
  let paid=0;const pays=(D().payments||{})[m.id]||{};
  for(const k in pays)paid+=Number(pays[k])||0;
  return {expected,paid,due:Math.max(0,expected-paid),months:months.length,paidMonths:months.filter(mo=>paidFor(m.id,mo)>0).length};
}
function dueMonths(m){return memberMonths(m).filter(mo=>paidFor(m.id,mo)<amount())}
function totals(){
  let jama=0;const p=D().payments||{};
  for(const mid in p)for(const k in p[mid])jama+=Number(p[mid][k])||0;
  let kharch=0;for(const e of D().expenses||[])kharch+=Number(e.amount)||0;
  return {jama,kharch,bacha:jama-kharch};
}
function mainRef(){return doc(db,"samiti","main")}

function save(mutate,msg){
  if(!S.admin)return Promise.resolve();
  const next=clone(S.data);mutate(next);next.updatedAt=Date.now();
  S.data=next;render();
  S.saving=S.saving.then(()=>setDoc(mainRef(),next)).then(()=>{if(msg)toast(msg)}).catch(e=>{console.error(e);toast("सेव नहीं हुआ, इंटरनेट जाँचें")});
  return S.saving;
}

// ---------- images ----------
async function compressImage(file,maxStart=1400,limit=650000){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=maxStart,q=0.7,out="";
    for(let t=0;t<7;t++){
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);
      if(out.length<limit)break;
      max=Math.round(max*0.8);q=Math.max(0.4,q-0.08);
    }
    if(out.length>900000)throw new Error("too big");
    return out;
  }finally{URL.revokeObjectURL(url)}
}
async function uploadBill(file,expenseId){
  const data=await compressImage(file);
  const id=uid()+uid();
  await setDoc(doc(db,"bills",id),{data,expenseId,at:Date.now()});
  S.billCache[id]=data;
  return id;
}
async function showBill(id,onDelete){
  const bar=h("div",{class:"bar"},h("button",{class:"btn",type:"button",onclick:()=>modal.remove()},"बंद करें"));
  if(onDelete)bar.append(confirmBtn("यह फ़ोटो हटाएँ","danger",()=>{modal.remove();onDelete()}));
  const modal=h("div",{class:"modal",role:"dialog","aria-label":"फ़ोटो",onclick:e=>{if(e.target===modal)modal.remove()}},
    bar,h("p",{style:"color:#fff"},"फ़ोटो खुल रही है…"));
  document.body.append(modal);
  try{
    let data=S.billCache[id];
    if(!data){const snap=await getDoc(doc(db,"bills",id));data=snap.exists()?snap.data().data:null;if(data)S.billCache[id]=data}
    modal.lastChild.replaceWith(data?h("img",{src:data,alt:"फ़ोटो"}):h("p",{style:"color:#fff"},"फ़ोटो नहीं मिली"));
  }catch(e){modal.lastChild.replaceWith(h("p",{style:"color:#fff"},"फ़ोटो लोड नहीं हुई"))}
}

// ---------- routing ----------
const VIEWS=()=>[["saransh","सारांश"],["jama","मासिक जमा"],["anurodh",S.admin?"अनुरोध":"पैसे जमा बताएँ"],["sadasya","सदस्य"],["kharcha","खर्च"],["baithak","बैठक"],["suchna","सूचना"]];
function readHash(){const v=(location.hash||"").slice(1);S.view=VIEWS().some(x=>x[0]===v)?v:"saransh"}
window.addEventListener("hashchange",()=>{const prev=S.view;readHash();if(S.view!=="sadasya")S.detail=null;else if(prev==="sadasya"&&!S._keep)S.detail=null;render(true);window.scrollTo(0,0)});
function renderTabs(){
  const t=document.getElementById("tabs");t.replaceChildren();
  for(const [k,label] of VIEWS()){
    const a=h("a",{href:"#"+k,"aria-current":S.view===k?"page":null,onclick:()=>{if(S.view===k&&S.detail){S.detail=null;render(true)}}},label);
    if(k==="anurodh"&&S.admin&&S.requests.length)a.append(h("span",{class:"badge"},String(S.requests.length)));
    t.append(a);
  }
}

// ---------- views ----------
function viewSaransh(){
  const t=totals();const out=[];
  out.push(h("section",null,h("div",{class:"ledger"},
    h("div",{class:"row"},h("span",null,"कुल जमा"),h("span",{class:"amt"},rs(t.jama))),
    h("div",{class:"row"},h("span",null,"कुल खर्च"),h("span",{class:"amt minus"},"− "+rs(t.kharch))),
    h("div",{class:"row total"},h("span",null,"बचे हुए पैसे"),h("span",{class:"amt"},rs(t.bacha))))));
  if(S.admin&&S.requests.length)out.push(h("section",null,h("a",{href:"#anurodh",class:"card req",style:"display:block;color:inherit;text-decoration:none"},
    S.requests.length+" सदस्यों ने पैसे जमा करने की सूचना भेजी है। देखकर मंज़ूर करें ›")));
  const active=(D().members||[]).filter(m=>memberActiveIn(m,S.monthNow));
  const paidNow=active.filter(m=>paidFor(m.id,S.monthNow)>0).length;
  out.push(h("section",null,h("h2",null,"इस महीने ("+monthLabel(S.monthNow)+")"),
    isSkipped(S.monthNow)?h("div",{class:"stat-line"},h("span",{class:"pill neutral"},"इस महीने छूट है, किसी से पैसे नहीं लिए जा रहे")):
    h("div",{class:"stat-line"},
      h("span",{class:"pill ok"},paidNow+" ने जमा किया"),
      h("span",{class:"pill due"},(active.length-paidNow)+" बाकी"),

// ----- member logins (mobile + PIN) -----
function normPhone(p){const d=String(p||"").replace(/\D/g,"");return d.length>10?d.slice(-10):d}
function emailFor(phone){return "m"+phone+"@"+LOGIN_DOMAIN}
function genPin(){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(a[0]%900000+100000)}
function secAuth(){
  if(!secAuthInst){const app2=initializeApp(C.firebase,"login-maker");secAuthInst=initializeAuth(app2,{persistence:inMemoryPersistence})}
  return secAuthInst;
}
function authErr(e){
  const c=e&&e.code||"";
  if(c==="auth/email-already-in-use")return "इस मोबाइल नंबर का लॉगिन पहले से बना है";
  if(c==="auth/operation-not-allowed")return "Firebase में Email/Password लॉगिन चालू नहीं है";
  if(c==="auth/too-many-requests")return "बहुत बार कोशिश हुई, थोड़ी देर बाद करें";
  if(c==="auth/network-request-failed")return "इंटरनेट जाँचें";
  return "काम नहीं हुआ ("+(c||"error")+")";
}
async function saveLogins(next){await setDoc(doc(db,"private","logins"),next);S.logins=next}
async function createLogin(m){
  const phone=normPhone(m.phone);
  if(phone.length!==10){toast("पहले 10 अंकों का मोबाइल नंबर डालें");return}
  if(Object.entries(S.logins).some(([id,l])=>id!==m.id&&l.phone===phone)){toast("यह नंबर किसी और सदस्य के लॉगिन में है");return}
  S.busy[m.id]=true;render(true);
  try{
    const pin=genPin();const a=secAuth();
    const cred=await createUserWithEmailAndPassword(a,emailFor(phone),pin);
    const uidv=cred.user.uid;await signOut(a);
    await setDoc(doc(db,"access",uidv),{memberId:m.id,phone});
    await saveLogins(Object.assign({},S.logins,{[m.id]:{phone,pin,uid:uidv}}));
    toast(m.name+" का लॉगिन बन गया");
  }catch(e){console.error(e);toast(authErr(e))}
  S.busy[m.id]=false;render(true);
}
async function changePin(m){
  const l=S.logins[m.id];if(!l)return;
  S.busy[m.id]=true;render(true);
  try{
    const a=secAuth();const cred=await signInWithEmailAndPassword(a,emailFor(l.phone),l.pin);
    const pin=genPin();await updatePassword(cred.user,pin);await signOut(a);
    await saveLogins(Object.assign({},S.logins,{[m.id]:Object.assign({},l,{pin})}));
    toast("नया PIN बन गया");
  }catch(e){console.error(e);toast(authErr(e))}
  S.busy[m.id]=false;render(true);
}
async function removeLogin(m,quiet){
  const l=S.logins[m.id];if(!l)return;
  S.busy[m.id]=true;if(!quiet)render(true);
  try{
    await deleteDoc(doc(db,"access",l.uid));
    try{const a=secAuth();const cred=await signInWithEmailAndPassword(a,emailFor(l.phone),l.pin);await deleteUser(cred.user)}catch(_){}
    const next=Object.assign({},S.logins);delete next[m.id];await saveLogins(next);
    if(!quiet)toast(m.name+" का लॉगिन बंद किया");
  }catch(e){console.error(e);toast(authErr(e))}
  S.busy[m.id]=false;render(true);
}

async function uploadMany(files,ref,onStep){

  return ids;
}

function fieldFocused(){const a=document.activeElement;return a&&document.getElementById("app").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.deferred&&!fieldFocused()){S.deferred=false;render(true)}},150));

  const app=document.getElementById("app");const tabsEl=document.querySelector("nav.tabs");
  const plain=nodes=>{tabsEl.style.display="none";app.replaceChildren(...nodes)};
  if(S.error)return plain([h("div",{class:"empty"},S.error)]);

  if(!S.user)return plain(viewLogin());

  if(!S.loaded)return plain([h("p",{class:"muted"},"हिसाब खुल रहा है…")]);

  app.replaceChildren(...fn());
}

// ---------- boot ----------
function stopSubs(){subs.forEach(u=>{try{u()}catch(_){}});subs=[]}
function startData(){
  subs.push(onSnapshot(mainRef(),snap=>{S.loaded=true;S.exists=snap.exists();S.data=snap.exists()?snap.data():null;render()},
    err=>{console.error(err);S.loaded=true;S.error="डेटा लोड नहीं हुआ। इंटरनेट जाँचें और पेज दोबारा खोलें।";render(true)}));
  if(S.admin){
    subs.push(onSnapshot(query(collection(db,"requests"),orderBy("at","asc")),qs=>{S.requests=qs.docs.map(d=>Object.assign({id:d.id},d.data()));render()},e=>console.error(e)));
    subs.push(onSnapshot(doc(db,"private","logins"),s=>{S.logins=s.exists()?s.data():{};render()},e=>console.error(e)));
  }else{
    subs.push(onSnapshot(query(collection(db,"requests"),where("memberId","==",S.me)),qs=>{S.requests=qs.docs.map(d=>Object.assign({id:d.id},d.data()));render()},e=>console.error(e)));
  }
}

  const fbApp=initializeApp(C.firebase);db=getFirestore(fbApp);auth=getAuth(fbApp);
  const adminEmail=String(C.adminEmail||"").trim().toLowerCase();
  document.getElementById("loginBtn").addEventListener("click",()=>signOut(auth));
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth,async u=>{
    stopSubs();
    Object.assign(S,{user:u,admin:false,me:null,noAccess:false,loaded:false,exists:false,data:null,requests:[],logins:{},error:""});
    if(u){

        catch(e){console.error(e);S.noAccess=true}
      }
      if(S.admin||S.me)startData();
    }
    S.authReady=true;render(true);
  });
}
</script>
