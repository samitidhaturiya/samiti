<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#B0571A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#8A4214" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>समिति का हिसाब</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFDF7; --surface:#FFFFFF; --ink:#2A1A14; --muted:#75645A; --line:#E9DFCF;
  --bahi:#8E1B2C; --bahi-ink:#FFF4E6; --head:#B0571A; --head-ink:#FFF6EC; --head-line:#F2B66B; --haldi:#C98A12; --haldi-soft:#FBEFD2;
  --ok:#2F7A4A; --ok-soft:#E3F2E7; --due:#B3261E; --due-soft:#FBE4E2;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#181012; --surface:#22181A; --ink:#F3E9E0; --muted:#B3A49A; --line:#3A2C2E;
    --bahi:#5E1420; --bahi-ink:#FFE9D2; --head:#8A4214; --head-ink:#FFEBD6; --head-line:#C98A3A; --haldi:#F0B848; --haldi-soft:#3A2D14;
    --ok:#6FCB8E; --ok-soft:#173023; --due:#F2877F; --due-soft:#3A1A18;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
h1,h2,h3{font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",Georgia,serif;font-weight:400;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

header.top{background:var(--head);color:var(--head-ink);padding:18px 0 0}
header.top .wrap{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header.top h1{font-size:1.55rem;line-height:1.25}
header.top .role{font-size:.9rem;opacity:.85;margin-top:2px}
.loginbtn{background:transparent;border:1px solid rgba(255,244,230,.55);color:var(--head-ink);border-radius:999px;padding:4px 12px;font-size:.85rem;white-space:nowrap;cursor:pointer}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);border-bottom:3px solid var(--head-line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px}
nav.tabs a{color:var(--head-ink);text-decoration:none;padding:8px 14px 10px;white-space:nowrap;border-radius:10px 10px 0 0;opacity:.8;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink);opacity:1}
nav.tabs a .badge{display:inline-block;background:var(--haldi);color:#2A1A14;border-radius:999px;padding:0 7px;font-size:.78rem;margin-left:4px}

main{padding:20px 0 48px}
section{margin-bottom:28px}
h2{font-size:1.35rem;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line);gap:12px}
.ledger .row:first-child{border-top:0}
.ledger .row.total{background:var(--haldi-soft)}
.ledger .row.total .amt{font-size:1.9rem;font-family:"Tiro Devanagari Hindi",Georgia,serif}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.minus{color:var(--due)}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{padding:12px 2px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}
.item .main{min-width:0;flex:1}
.item .title{font-weight:500;overflow-wrap:anywhere}
.item .meta{font-size:.88rem;color:var(--muted)}
.item.left{opacity:.6}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.neutral{background:var(--haldi-soft);color:var(--ink)}

.toggle{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-width:96px;font-weight:500;cursor:pointer}
.toggle.paid{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.toggle.unpaid{background:var(--due-soft);border-color:transparent;color:var(--due)}
.toggle:disabled{cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.next-meet{border-left:5px solid var(--haldi)}
.notice{border-left:5px solid var(--bahi);margin-bottom:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.req{border-left:5px solid var(--haldi);margin-bottom:10px}

form.f{display:grid;gap:10px;background:var(--surface);border:1px dashed var(--haldi);border-radius:14px;padding:14px;margin-bottom:16px}
form.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:1rem}
input[type=checkbox]{width:auto}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--haldi);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--bahi);color:#FFF4E6;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--due);border:1px solid var(--due)}
.btn.okb{background:var(--ok);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink);background:var(--paper);cursor:pointer}
.checks label.on{border-color:var(--ok);background:var(--ok-soft)}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthbar h2{margin:0;text-align:center;flex:1}
.stat-line{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:20;display:none;max-width:90vw;text-align:center}
.status.show{display:block}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.modal img{max-width:100%;max-height:80vh;border-radius:8px;background:#fff}
.modal .bar{display:flex;gap:8px;margin-bottom:10px}
.modal .btn.danger{background:#fff}
.namebtn{background:none;border:0;padding:0;font:inherit;font-weight:500;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.namebtn:hover{text-decoration-color:var(--haldi)}
.pill.post{background:var(--head);color:var(--head-ink);margin-left:8px;font-size:.78rem;vertical-align:2px}
.postsel{width:auto;padding:5px 8px;font-size:.88rem;border-radius:10px}
.callbtn{display:inline-grid;place-items:center;width:30px;height:30px;margin-left:8px;border-radius:50%;background:var(--ok-soft);border:1px solid var(--ok);text-decoration:none;font-size:.95rem;vertical-align:middle;line-height:1}
.namebtn .chev{color:var(--muted);text-decoration:none;display:inline-block}
.mlist .yearhead{padding:8px 16px;background:var(--paper);font-weight:700;border-top:1px solid var(--line);color:var(--muted)}
.mlist .yearhead:first-child{border-top:0}
.mrow{display:grid;grid-template-columns:1fr auto minmax(90px,auto);gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.mrow .amt{text-align:right}
.mrow.dim{opacity:.55}
@media (max-width:420px){form.f .two{grid-template-columns:1fr}}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--head-line,#F2B66B);background:#fff;flex:none}
@media (max-width:420px){header.top .logo{width:50px;height:50px}}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  body::before{display:none!important}
  :root{padding:0}
  body{background:#fff!important;color:#000!important;font-size:12px}
  #print-area{display:block;color:#000}
  #print-area .ptop{display:flex;gap:12px;align-items:center;border-bottom:3px solid #B0571A;padding-bottom:8px;margin-bottom:6px}
  #print-area .ptop img{width:64px;height:64px;border-radius:50%;object-fit:cover}
  #print-area h1{font-size:20px} #print-area h2{font-size:15px;margin:14px 0 6px}
  #print-area table{width:100%;border-collapse:collapse;margin-bottom:6px}
  #print-area th,#print-area td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  #print-area th{background:#f3e6d8}
  #print-area .r{text-align:right}
  @page{margin:12mm}
}
</style>
<script src="config.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img id="logo" class="logo" alt="" hidden><div><h1 id="samitiName">समिति का हिसाब</h1><div class="role" id="roleLine">लोड हो रहा है…</div></div></div>
  <button class="loginbtn" id="loginBtn" type="button" hidden>लॉगआउट</button>
</div></header>
<nav class="tabs" aria-label="भाग"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="app"><p class="muted">हिसाब खुल रहा है…</p></div></main>
<div class="status" id="status" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, addDoc, deleteDoc, query, where, orderBy, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, initializeAuth, inMemoryPersistence, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const MONTHS=["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
const LOGIN_DOMAIN="samiti-login.app";
const S={data:null,exists:false,admin:false,user:null,me:null,authReady:false,noAccess:false,loaded:false,error:"",month:curMonth(),monthNow:curMonth(),view:"saransh",
  requests:[],logins:{},editing:null,leaving:null,rejoining:null,decisionEdit:null,meetEdit:null,loanEdit:null,loanClose:null,rateEdit:null,byajPay:null,aayEdit:null,raw:{},log:[],logAll:false,logOpen:false,migrating:false,showClosedLoans:false,expEdit:null,detail:null,showGone:false,busy:{},billCache:{},deferred:false,saving:Promise.resolve(),
  req:{months:[],amount:"",method:"नकद",note:"",sent:false}};
let db,auth,secAuthInst=null,C=window.SAMITI_CONFIG,subs=[];

function curMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function monthLabel(m){const [y,mo]=m.split("-");return MONTHS[+mo-1]+" "+y}
function addMonth(m,n){let [y,mo]=m.split("-").map(Number);mo+=n;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+"-"+String(mo).padStart(2,"0")}
function monthsBetween(a,b){if(!a||a>b)return[];const out=[];let m=a;while(m<=b){out.push(m);m=addMonth(m,1)}return out}
function dateLabel(d){if(!d)return"";const [y,m,dd]=d.split("-");return (+dd)+" "+MONTHS[+m-1]+" "+y}
function rs(n){const v=Math.round(n||0);return (v<0?"−":"")+"₹"+Math.abs(v).toLocaleString("en-IN")}
function uid(){return Math.random().toString(36).slice(2,10)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false)continue;
    if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="class")el.className=v;
    else if(k==="text")el.textContent=v;
    else if(k==="value")el.value=v;
    else if(k==="checked")el.checked=!!v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}
  return el;
}
function toast(msg){const s=document.getElementById("status");s.textContent=msg;s.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>s.classList.remove("show"),2600)}
function confirmBtn(label,cls,onYes){
  const b=h("button",{class:"btn small "+cls,type:"button",text:label});
  let armed=false,t;
  b.addEventListener("click",()=>{
    if(!armed){armed=true;b.textContent="पक्का?";t=setTimeout(()=>{armed=false;b.textContent=label},3000);return}
    clearTimeout(t);onYes();
  });
  return b;
}

// ---------- data helpers ----------
function D(){return S.data||{}}
function rateList(){const r=Array.isArray(D().rates)&&D().rates.length?D().rates.slice():[];if(!r.length)r.push({from:"0000-01",amount:Number(D().monthly)||100});return r.sort((a,b)=>a.from.localeCompare(b.from))}
function amountFor(mo){let a=null;for(const r of rateList())if(r.from<=mo)a=Number(r.amount)||0;if(a==null)a=Number(rateList()[0].amount)||0;return a}
function amount(){return amountFor(S.monthNow||curMonth())}
function isSkipped(month){return (D().skipped||[]).includes(month)}
function periods(m){return (Array.isArray(m.periods)&&m.periods.length)?m.periods.map(p=>({from:p.from,to:p.to||null})):[{from:m.join,to:m.left||null}]}
function syncPeriods(x){x.periods.sort((a,b)=>a.from.localeCompare(b.from));x.join=x.periods[0].from;x.left=x.periods[x.periods.length-1].to||null}
function memberActiveIn(m,month){return periods(m).some(p=>p.from<=month&&(!p.to||p.to>=month))}
function isCurrent(m){const ps=periods(m),l=ps[ps.length-1];return l.from<=S.monthNow?(!l.to||l.to>=S.monthNow):true}
function paidFor(mid,month){return Number(((D().payments||{})[mid]||{})[month])||0}
function memberMonths(m){const out=[];for(const p of periods(m)){const end=p.to&&p.to<S.monthNow?p.to:S.monthNow;for(const mo of monthsBetween(p.from,end))if(!isSkipped(mo)&&!out.includes(mo))out.push(mo)}return out}
function memberSummary(m){
  const months=memberMonths(m);const expected=months.reduce((t,mo)=>t+amountFor(mo),0);
  let paid=0;const pays=(D().payments||{})[m.id]||{};
  for(const k in pays)paid+=Number(pays[k])||0;
  return {expected,paid,due:Math.max(0,expected-paid),months:months.length,paidMonths:months.filter(mo=>paidFor(m.id,mo)>0).length};
}
function dueMonths(m){return memberMonths(m).filter(mo=>paidFor(m.id,mo)<amountFor(mo))}
function totals(){
  let jama=0;const p=D().payments||{};
  for(const mid in p)for(const k in p[mid])jama+=Number(p[mid][k])||0;
  let kharch=0;for(const e of D().expenses||[])kharch+=Number(e.amount)||0;
  let loanOut=0,byaj=0;for(const l of D().loans||[]){byaj+=byajPaidSum(l);if(l.closed)byaj+=(Number(l.closed.amount)||0)-(Number(l.amount)||0);else loanOut+=Number(l.amount)||0}
  let aay=0;for(const x of D().incomes||[])aay+=Number(x.amount)||0;
  return {jama,kharch,byaj,loanOut,aay,bacha:jama+aay+byaj-kharch-loanOut};
}
function mainRef(){return doc(db,"samiti","main")}

// ---------- storage: split into several docs ----------
const PARTS=["logo","expenses","incomes","meetings","notices","loans"];
const DOC_LIMIT=1000000;
function partRef(p){return doc(db,"samiti",p)}
function mainOnly(d){const m=Object.assign({},d);for(const p of PARTS)delete m[p];return m}
function rebuild(){
  if(!S.raw.main){S.data=null;return}
  const d=Object.assign({},S.raw.main);
  for(const p of PARTS)if(S.raw[p]!==undefined)d[p]=S.raw[p];
  S.data=d;
}
function bytes(o){try{return new TextEncoder().encode(JSON.stringify(o)).length}catch(_){return 0}}
function partSizes(){
  const d=S.data||{};const out=[["मुख्य",bytes(mainOnly(d))]];
  const L={logo:"फ़ोटो",expenses:"खर्च",incomes:"आय",meetings:"बैठक",notices:"सूचना",loans:"ऋण"};
  for(const p of PARTS)out.push([L[p],bytes({v:d[p]==null?null:d[p]})]);
  return out.map(([n,b])=>({name:n,bytes:b,pct:Math.min(100,Math.round(b/DOC_LIMIT*1000)/10)}));
}
function logId(){return "log-"+new Date().getFullYear()}
function save(mutate,msg){
  if(!S.admin)return Promise.resolve();
  const prev=S.data;const next=clone(S.data);mutate(next);
  S.data=next;render();
  const writes=[];
  const pm=mainOnly(prev||{}),nm=mainOnly(next);delete pm.updatedAt;delete nm.updatedAt;
  if(JSON.stringify(pm)!==JSON.stringify(nm)){nm.updatedAt=Date.now();nm.splitV=2;writes.push([mainRef(),nm])}
  for(const p of PARTS)if(JSON.stringify((prev||{})[p])!==JSON.stringify(next[p]))writes.push([partRef(p),{v:next[p]==null?null:next[p]}]);
  const entry={t:Date.now(),by:(S.user&&S.user.email)||"",msg:msg||"हिसाब में बदलाव"};
  S.saving=S.saving.then(async()=>{
    for(const [ref,obj] of writes)await setDoc(ref,obj);
    if(writes.length)await setDoc(doc(db,"samiti",logId()),{entries:arrayUnion(entry)},{merge:true});
  }).then(()=>{if(msg)toast(msg)}).catch(e=>{console.error(e);toast("सेव नहीं हुआ, इंटरनेट जाँचें")});
  return S.saving;
}
async function migrateIfNeeded(){
  const m=S.raw.main;if(!S.admin||!m||m.splitV>=2||S.migrating)return;
  S.migrating=true;
  try{
    for(const p of PARTS){
      if(m[p]===undefined)continue;
      const ex=await getDoc(partRef(p));
      if(!ex.exists())await setDoc(partRef(p),{v:m[p]});
    }
    const nm=mainOnly(m);nm.splitV=2;nm.updatedAt=Date.now();
    await setDoc(mainRef(),nm);
    await setDoc(doc(db,"samiti",logId()),{entries:arrayUnion({t:Date.now(),by:(S.user&&S.user.email)||"",msg:"हिसाब नए तरीके (अलग-अलग पेज) में व्यवस्थित किया गया"})},{merge:true});
    toast("हिसाब नए तरीके से व्यवस्थित हो गया");
  }catch(e){console.error(e);toast("व्यवस्थित नहीं हो सका, पेज दोबारा खोलें")}
  S.migrating=false;
}

// ---------- images ----------
async function compressImage(file,maxStart=1400,limit=650000){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=maxStart,q=0.7,out="";
    for(let t=0;t<7;t++){
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);

// ----- member logins (mobile + PIN) -----
function normPhone(p){const d=String(p||"").replace(/\D/g,"");return d.length>10?d.slice(-10):d}
function emailFor(phone){return "m"+phone+"@"+LOGIN_DOMAIN}
function genPin(){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(a[0]%900000+100000)}
function secAuth(){
  if(!secAuthInst){const app2=initializeApp(C.firebase,"login-maker");secAuthInst=initializeAuth(app2,{persistence:inMemoryPersistence})}
  return secAuthInst;
}
function authErr(e){
  const c=e&&e.code||"";
  if(c==="auth/email-already-in-use")return "इस मोबाइल नंबर का लॉगिन पहले से बना है";
  if(c==="auth/operation-not-allowed")return "Firebase में Email/Password लॉगिन चालू नहीं है";
  if(c==="auth/too-many-requests")return "बहुत बार कोशिश हुई, थोड़ी देर बाद करें";
  if(c==="auth/network-request-failed")return "इंटरनेट जाँचें";
  return "काम नहीं हुआ ("+(c||"error")+")";
}
async function saveLogins(next){await setDoc(doc(db,"private","logins"),next);S.logins=next}
async function createLogin(m){
  const phone=normPhone(m.phone);
  if(phone.length!==10){toast("पहले 10 अंकों का मोबाइल नंबर डालें");return}
  if(Object.entries(S.logins).some(([id,l])=>id!==m.id&&l.phone===phone)){toast("यह नंबर किसी और सदस्य के लॉगिन में है");return}
  S.busy[m.id]=true;render(true);
  try{
    const pin=genPin();const a=secAuth();
    const cred=await createUserWithEmailAndPassword(a,emailFor(phone),pin);
    const uidv=cred.user.uid;await signOut(a);
    await setDoc(doc(db,"access",uidv),{memberId:m.id,phone});
    await saveLogins(Object.assign({},S.logins,{[m.id]:{phone,pin,uid:uidv}}));
    toast(m.name+" का लॉगिन बन गया");
  }catch(e){console.error(e);toast(authErr(e))}
  S.busy[m.id]=false;render(true);
}
async function changePin(m){
  const l=S.logins[m.id];if(!l)return;
  S.busy[m.id]=true;render(true);
  try{
    const a=secAuth();const cred=await signInWithEmailAndPassword(a,emailFor(l.phone),l.pin);
    const pin=genPin();await updatePassword(cred.user,pin);await signOut(a);
    await saveLogins(Object.assign({},S.logins,{[m.id]:Object.assign({},l,{pin})}));
    toast("नया PIN बन गया");
  }catch(e){console.error(e);toast(authErr(e))}
  S.busy[m.id]=false;render(true);
}
async function removeLogin(m,quiet){
  const l=S.logins[m.id];if(!l)return;
  S.busy[m.id]=true;if(!quiet)render(true);
  try{
    await deleteDoc(doc(db,"access",l.uid));
    try{const a=secAuth();const cred=await signInWithEmailAndPassword(a,emailFor(l.phone),l.pin);await deleteUser(cred.user)}catch(_){}
    const next=Object.assign({},S.logins);delete next[m.id];await saveLogins(next);
    if(!quiet)toast(m.name+" का लॉगिन बंद किया");
  }catch(e){console.error(e);toast(authErr(e))}
  S.busy[m.id]=false;render(true);
}

const ALERT_DAY=5;

function monthEndOf(d){const y=+d.slice(0,4),m=+d.slice(5,7);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return d.slice(0,8)+String(last).padStart(2,"0")}
function prevMonthEnd(d){const y=+d.slice(0,4),m=+d.slice(5,7);const dt=new Date(Date.UTC(y,m-1,0));return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0")}
function loanStatus(l){

    st.dueText=n>0?n+" दिन शेष":n===0?"आज अंतिम तारीख़":(-n)+" दिन ऊपर हो गए";
    st.dueCls=n<0||n===0?"due":n<=7?"warn":"ok";}
  const me=monthEndOf(td),pe=prevMonthEnd(td);
  const paid=byajPaidSum(l);
  const toMonthEnd=me>=l.date?loanCalc(l,me).byaj:0;
  const toPrevEnd=pe>=l.date?loanCalc(l,pe).byaj:0;

  st.intThis=Math.max(0,toMonthEnd-paid);

}

      h("div",{style:"white-space:pre-wrap;overflow-wrap:anywhere",text:x.decision})));
  }
  if(files.length)card.append(h("div",{style:"margin-top:10px"},
    h("div",{class:"small muted",style:"margin-bottom:4px"},"लिखित निर्णय / कार्यवाही की फ़ोटो"),
    h("div",{class:"actions",style:"justify-content:flex-start"},files.map((id,i)=>h("button",{class:"btn small ghost",type:"button",
      onclick:()=>showBill(id,S.admin?()=>{save(d=>{const m=d.meetings.find(y=>y.id===x.id);if(m)m.files=(m.files||[]).filter(f=>f!==id)},"फ़ोटो हटाई");deleteDoc(doc(db,"bills",id)).catch(()=>{})}:null)},"📄 पेज "+(i+1))))));
  if(!S.admin)card.append(h("div",{class:"actions",style:"margin-top:10px;justify-content:flex-start"},waBtn(meetingShareText(x))));
  if(S.admin){
    const st=h("span",{class:"meta"});
    card.append(h("div",{class:"actions",style:"margin-top:10px;justify-content:flex-start"},waBtn(meetingShareText(x),"📤 बैठक की सूचना शेयर करें")));
    const fi=h("input",{type:"file",accept:"image/*",multiple:true,hidden:true,onchange:async ev=>{
      const fl=[...ev.target.files];if(!fl.length)return;
      try{const ids=await uploadMany(fl,x.id,(i,n)=>{st.textContent="फ़ोटो "+i+"/"+n+" अपलोड हो रही है…"});
        save(d=>{const m=d.meetings.find(y=>y.id===x.id);if(m)m.files=(m.files||[]).concat(ids)},ids.length+" फ़ोटो जुड़ गईं")}
      catch(err){console.error(err);st.textContent="";toast("फ़ोटो अपलोड नहीं हुई")}
    }});
    card.append(h("div",{class:"actions",style:"margin-top:10px;justify-content:flex-start;align-items:center"},
      h("button",{class:"btn small ghost",type:"button",onclick:()=>{S.meetEdit=x.id;S.decisionEdit=null;render(true)}},"✏️ जानकारी सुधारें"),
      h("button",{class:"btn small ghost",type:"button",onclick:()=>{S.decisionEdit=x.id;S.meetEdit=null;render(true)}},x.decision?"निर्णय बदलें":"निर्णय लिखें"),
      fi,h("button",{class:"btn small ghost",type:"button",onclick:()=>fi.click()},"📎 फ़ोटो जोड़ें"),
      confirmBtn("बैठक हटाएँ","danger",()=>{save(d=>{d.meetings=d.meetings.filter(y=>y.id!==x.id)},"बैठक हटाई");files.forEach(id=>deleteDoc(doc(db,"bills",id)).catch(()=>{}))}),
      st));
  }
  return card;
}
function viewBaithak(){
  const out=[];const all=(D().meetings||[]);
  const up=all.filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));
  const past=all.filter(x=>x.date<today()).sort((a,b)=>b.date.localeCompare(a.date));
  if(S.admin){
    const date=h("input",{type:"date",value:today(),required:true});
    const time=h("input",{type:"time"});
    const place=h("input",{placeholder:"कहाँ होगी"});
    const agenda=h("textarea",{placeholder:"किन बातों पर चर्चा होगी"});
    const fi=h("input",{type:"file",accept:"image/*",multiple:true});
    const btn=h("button",{class:"btn",type:"submit"},"बैठक जोड़ें");
    out.push(h("section",null,h("h2",null,"बैठक जोड़ें"),
      h("form",{class:"f",onsubmit:async e=>{e.preventDefault();if(!date.value)return;
        const id=uid();let files=[];const fl=[...fi.files];
        if(fl.length){btn.disabled=true;
          try{files=await uploadMany(fl,id,(i,n)=>{btn.textContent="फ़ोटो "+i+"/"+n+" अपलोड हो रही है…"})}
          catch(err){console.error(err);btn.disabled=false;btn.textContent="बैठक जोड़ें";toast("फ़ोटो अपलोड नहीं हुई");return}}
        save(d=>{d.meetings=d.meetings||[];d.meetings.push({id,date:date.value,time:time.value,place:place.value.trim(),agenda:agenda.value.trim(),decision:"",files})},"बैठक जुड़ गई")}},
        h("div",{class:"two"},h("label",null,"तारीख़",date),h("label",null,"समय",time)),
        h("label",null,"जगह",place),h("label",null,"विषय",agenda),
        h("label",null,"लिखित निर्णय की फ़ोटो (ज़रूरी नहीं, कई पेज चुन सकते हैं)",fi),
        h("p",{class:"small muted",style:"margin:0"},"बैठक हो जाने के बाद भी हर बैठक में \"निर्णय लिखें\" और \"फ़ोटो जोड़ें\" कर सकते हैं।"),
        h("div",null,btn))));
  }
  out.push(h("section",null,h("h2",null,"आने वाली बैठकें"),up.length?up.map((x,i)=>meetingCard(x,i===0)):h("div",{class:"empty"},"कोई बैठक तय नहीं है")));
  if(past.length)out.push(h("section",null,h("h2",null,"पिछली बैठकें"),past.map(x=>meetingCard(x,false))));
  return out;
}
function appUrl(){return location.origin+location.pathname}
function isAndroid(){return /Android/i.test(navigator.userAgent||"")}
function waUrl(text,phone){
  const q=(phone?"phone="+phone+"&":"")+"text="+encodeURIComponent(text);
  const web="https://wa.me/"+(phone||"")+"?text="+encodeURIComponent(text);
  if(isAndroid())return "intent://send?"+q+"#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url="+encodeURIComponent(web)+";end";
  return web;
}
function waShareLink(text){return waUrl(text)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("मैसेज कॉपी हो गया, अब जहाँ चाहें पेस्ट करें")}catch(_){toast("शेयर नहीं हो सका")}}
async function shareText(t){
  if(navigator.share){try{await navigator.share({text:t})}catch(e){if(!e||e.name!=="AbortError")copyText(t)}}
  else copyText(t);
}
function waBtn(text,label){return h("button",{class:"btn small okb",type:"button",onclick:()=>shareText(text)},label||"📤 शेयर करें")}
function noticeShareText(n){return "📢 *"+(D().name||"समिति")+"*\nसूचना · "+dateLabel(n.date)+"\n\n"+n.text+"\n\nऐप में देखें: "+appUrl()}
function meetingShareText(x){
  let t="🙏 *"+(D().name||"समिति")+"*\n*बैठक की सूचना*\n\n📅 "+dateLabel(x.date)+(x.time?", "+x.time+" बजे":"");
  if(x.place)t+="\n📍 "+x.place;
  if(x.agenda)t+="\n\nविषय:\n"+x.agenda;
  if(x.decision)t+="\n\nलिया गया निर्णय:\n"+x.decision;
  return t+"\n\nऐप में देखें: "+appUrl();
}
function noticeCard(n){
  return h("div",{class:"card notice"},h("div",{class:"meta",style:"margin-bottom:4px"},dateLabel(n.date)),h("div",{text:n.text}),
    h("div",{class:"actions",style:"margin-top:8px;justify-content:flex-start"},waBtn(noticeShareText(n)),
      S.admin?confirmBtn("हटाएँ","danger",()=>save(d=>{d.notices=d.notices.filter(y=>y.id!==n.id)},"सूचना हटाई")):null));
}
function viewSuchna(){
  const out=[];const list=(D().notices||[]).slice().sort((a,b)=>b.at-a.at);
  if(S.admin){
    const text=h("textarea",{placeholder:"सभी सदस्यों के लिए सूचना लिखें",required:true});
    out.push(h("section",null,h("h2",null,"नई सूचना"),
      h("form",{class:"f",onsubmit:e=>{e.preventDefault();const t=text.value.trim();if(!t)return;
        save(d=>{d.notices=d.notices||[];d.notices.push({id:uid(),date:today(),at:Date.now(),text:t})},"सूचना भेज दी")}},
        text,h("div",null,h("button",{class:"btn",type:"submit"},"सूचना जारी करें")))));
  }
  out.push(h("section",null,h("h2",null,"सभी सूचनाएँ"),list.length?list.map(noticeCard):h("div",{class:"empty"},"अभी कोई सूचना नहीं")));
  return out;
}

function viewSetup(){
  if(!S.admin)return [h("div",{class:"empty"},"अध्यक्ष ने अभी समिति का हिसाब शुरू नहीं किया है।")];
  const file=h("input",{type:"file",accept:"application/json,.json"});
  const name=h("input",{placeholder:"समिति का नाम",required:true});
  const amt=h("input",{type:"number",min:"1",value:"100",inputmode:"numeric"});
  const start=h("input",{type:"month",value:S.monthNow});
  const names=h("textarea",{placeholder:"हर लाइन में एक नाम",style:"min-height:180px"});
  async function start_(data){try{await setDoc(mainRef(),Object.assign(data,{createdAt:Date.now()}));toast("समिति शुरू हो गई")}catch(err){console.error(err);toast("सेव नहीं हुआ। Firestore rules में आपका ईमेल सही है?")}}
  return [h("section",null,h("h2",null,"समिति शुरू करें"),
    h("div",{class:"card",style:"margin-bottom:16px"},
      h("p",{style:"margin-top:0"},"Claude वाले ऐप का पुराना डेटा (purana-data.json) चुनें:"),file,
      h("div",{style:"margin-top:10px"},h("button",{class:"btn",type:"button",onclick:async()=>{
        const f=file.files[0];if(!f){toast("पहले फ़ाइल चुनें");return}
        try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.members))throw 0;start_(d)}catch(_){toast("यह सही फ़ाइल नहीं है")}
      }},"पुराने डेटा से शुरू करें"))),
    h("p",{class:"muted"},"या नए सिरे से:"),
    h("form",{class:"f",onsubmit:e=>{e.preventDefault();const n=name.value.trim();if(!n)return;
      const list=names.value.split("\n").map(x=>x.trim()).filter(Boolean);
      start_({name:n,monthly:Number(amt.value)||100,members:list.map(x=>({id:uid(),name:x,phone:"",join:start.value||S.monthNow,left:null})),payments:{},expenses:[],meetings:[],notices:[],skipped:[]})}},
      h("label",null,"समिति का नाम",name),
      h("div",{class:"two"},h("label",null,"मासिक राशि (₹)",amt),h("label",null,"किस महीने से",start)),
      h("label",null,"सदस्यों के नाम",names),
      h("div",null,h("button",{class:"btn",type:"submit"},"समिति शुरू करें"))))];
}

function viewLogin(){
  const phone=h("input",{inputmode:"numeric",autocomplete:"username",placeholder:"10 अंकों का मोबाइल नंबर",required:true,maxlength:"14"});
  const pin=h("input",{type:"password",inputmode:"numeric",autocomplete:"current-password",placeholder:"6 अंकों का PIN",required:true,maxlength:"6"});
  const btn=h("button",{class:"btn",type:"submit",style:"width:100%"},"लॉगिन करें");
  return [h("section",{style:"max-width:420px;margin:12px auto"},
    h("h2",null,"सदस्य लॉगिन"),
    h("p",{class:"muted"},"यह हिसाब सिर्फ़ समिति के सदस्यों के लिए है। अध्यक्ष से मिला मोबाइल नंबर और PIN डालें।"),
    h("form",{class:"f",onsubmit:async e=>{e.preventDefault();
      const p=normPhone(phone.value);if(p.length!==10){toast("10 अंकों का मोबाइल नंबर डालें");return}
      btn.disabled=true;btn.textContent="लॉगिन हो रहा है…";
      try{await signInWithEmailAndPassword(auth,emailFor(p),pin.value.trim())}
      catch(err){btn.disabled=false;btn.textContent="लॉगिन करें";const c=err&&err.code||"";
        toast(c==="auth/too-many-requests"?"बहुत बार गलत PIN, थोड़ी देर बाद कोशिश करें":c==="auth/network-request-failed"?"इंटरनेट जाँचें":"मोबाइल नंबर या PIN गलत है")}
    }},h("label",null,"मोबाइल नंबर",phone),h("label",null,"PIN",pin),btn),
    h("p",{class:"small muted",style:"text-align:center"},"PIN भूल गए? अध्यक्ष से नया PIN लें।"),
    h("div",{style:"text-align:center;margin-top:24px"},h("button",{class:"btn ghost small",type:"button",onclick:adminLogin},"अध्यक्ष हैं? Google से लॉगिन")))];
}
async function adminLogin(){
  const prov=new GoogleAuthProvider();
  try{await signInWithPopup(auth,prov)}catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))signInWithRedirect(auth,prov);else if(e&&e.code!=="auth/popup-closed-by-user")toast("लॉगिन नहीं हुआ")}
}

// ---------- render ----------
function fieldFocused(){const a=document.activeElement;return a&&document.getElementById("app").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.deferred&&!fieldFocused()){S.deferred=false;render(true)}},150));
function render(force){
  if(!force&&fieldFocused()){S.deferred=true;return}
  S.monthNow=curMonth();
  const showName=S.data&&S.data.name;
  document.getElementById("samitiName").textContent=showName||"समिति का हिसाब";
  if(S.data){const lg=S.data.logo||"";if((lsGet("samiti_logo")||"")!==lg)lsSet("samiti_logo",lg)}
  const logoSrc=S.data?(S.data.logo||""):(lsGet("samiti_logo")||"");
  const li=document.getElementById("logo");if(logoSrc){if(li.getAttribute("src")!==logoSrc)li.src=logoSrc;li.hidden=false}else li.hidden=true;
  document.title=showName||"समिति का हिसाब";
  const lb=document.getElementById("loginBtn");
  lb.hidden=!S.user;lb.textContent="लॉगआउट";
  const me=(D().members||[]).find(m=>m.id===S.me);
  document.getElementById("roleLine").textContent=!S.authReady?"लोड हो रहा है…":!S.user?"सिर्फ़ सदस्यों के लिए":S.admin?"आप अध्यक्ष हैं · पूरा अधिकार":me?"नमस्ते, "+me.name:"";
  const app=document.getElementById("app");const tabsEl=document.querySelector("nav.tabs");
  const plain=nodes=>{tabsEl.style.display="none";app.replaceChildren(...nodes)};
  if(S.error)return plain([h("div",{class:"empty"},S.error)]);
  if(!S.authReady)return plain([h("p",{class:"muted"},"खुल रहा है…")]);
  if(!S.user)return plain(viewLogin());
  if(S.noAccess)return plain([h("div",{class:"empty"},"इस खाते से हिसाब देखने की अनुमति नहीं है। अध्यक्ष से संपर्क करें।")]);
  if(!S.loaded)return plain([h("p",{class:"muted"},"हिसाब खुल रहा है…")]);
  if(!S.exists)return plain(viewSetup());
  readHash();tabsEl.style.display="";renderTabs();
  const fn={aay:viewAay,rin:viewRin,mera:viewMera,saransh:viewSaransh,jama:viewJama,anurodh:viewAnurodh,sadasya:viewSadasya,kharcha:viewKharcha,baithak:viewBaithak,suchna:viewSuchna}[S.view];
  app.replaceChildren(...dueAlerts(),...fn());
}

// ---------- boot ----------
function stopSubs(){subs.forEach(u=>{try{u()}catch(_){}});subs=[]}
function startData(){
  S.raw={};S.log=[];
  for(const p of PARTS)subs.push(onSnapshot(partRef(p),snap=>{if(snap.exists())S.raw[p]=snap.data().v;else delete S.raw[p];rebuild();render()},e=>console.error(e)));
  subs.push(onSnapshot(doc(db,"samiti",logId()),snap=>{S.log=snap.exists()?(snap.data().entries||[]):[];render()},e=>console.error(e)));
  subs.push(onSnapshot(mainRef(),snap=>{S.loaded=true;S.exists=snap.exists();S.raw.main=snap.exists()?snap.data():null;rebuild();render();if(S.admin)S.saving=S.saving.then(migrateIfNeeded)},
    err=>{console.error(err);S.loaded=true;S.error="डेटा लोड नहीं हुआ। इंटरनेट जाँचें और पेज दोबारा खोलें।";render(true)}));
  if(S.admin){
    subs.push(onSnapshot(query(collection(db,"requests"),orderBy("at","asc")),qs=>{S.requests=qs.docs.map(d=>Object.assign({id:d.id},d.data()));render()},e=>console.error(e)));
    subs.push(onSnapshot(doc(db,"private","logins"),s=>{S.logins=s.exists()?s.data():{};render()},e=>console.error(e)));
  }else{
    subs.push(onSnapshot(query(collection(db,"requests"),where("memberId","==",S.me)),qs=>{S.requests=qs.docs.map(d=>Object.assign({id:d.id},d.data()));render()},e=>console.error(e)));
  }
}
if(!C||!C.firebase||!C.firebase.apiKey||C.firebase.apiKey.includes("यहाँ")){
  S.error="config.js में Firebase की जानकारी अभी नहीं डाली गई है।";render(true);
}else{
  const fbApp=initializeApp(C.firebase);db=getFirestore(fbApp);auth=getAuth(fbApp);
  const adminEmail=String(C.adminEmail||"").trim().toLowerCase();
  document.getElementById("loginBtn").addEventListener("click",()=>signOut(auth));
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth,async u=>{
    stopSubs();
    Object.assign(S,{user:u,admin:false,me:null,noAccess:false,loaded:false,exists:false,data:null,requests:[],logins:{},error:""});
    if(u){
      S.admin=!!(u.email&&u.email.toLowerCase()===adminEmail);
      if(!S.admin){
        try{const a=await getDoc(doc(db,"access",u.uid));if(a.exists())S.me=a.data().memberId;else S.noAccess=true}
        catch(e){console.error(e);S.noAccess=true}
      }
      if(S.admin||S.me)startData();
    }
    S.authReady=true;render(true);
  });
}
